# Builds, tests, and checks formatting on every pull request and on every push to main.
# Warnings are errors (see Directory.Build.props), so this job is the guardrail that
# catches rule violations whether or not the author read the rules.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      # The .NET 11 SDK from global.json builds both target frameworks.
      # The .NET 10 SDK is installed as well because it brings the .NET 10 runtime,
      # which the net10.0 tests need in order to run.
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore
